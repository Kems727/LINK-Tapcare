<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TapCare - Printable Cards</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>.urlbox{font:600 .85rem ui-monospace,Menlo,monospace;background:var(--tint2);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all}</style>
</head>
<body>
<div class="demo-bar noprint">Class demo - sample cards. Print on white card stock or use as a design for your NFC cards.</div>
<header class="top noprint"><div class="wrap"><a class="brand" href="index.html#/"><img src="assets/logo.svg" alt="">TapCare</a><nav class="nav"><a href="index.html#/demo">Demo page</a><a href="index.html#/">Home</a></nav></div></header>
<main><div class="wrap stack" id="root"></div></main>
<script src="assets/vendor/qrcode.js"></script>
<script type="module">
import { h } from "./js/ui.js";
const base = new URL("index.html", location.href).href.replace(/index\.html.*$/, "");
const urlFor = (id) => base + "#/tap/" + id;
const q = new URLSearchParams(location.search);
const cards = [
  { id: "TC-P-0001", name: "Pietrel Rigel Edward Khan", role: "PATIENT CARD", sub: "Calamba Sample General Hospital" },
  { id: "TC-D-0001", name: "Dr. John Henrick Raquedan", role: "STAFF CARD - DOCTOR", sub: "Internal Medicine | Calamba Sample General Hospital" },
];
if (q.get("id") && !cards.find((c) => c.id === q.get("id"))) cards.push({ id: q.get("id"), name: q.get("name") || q.get("id"), role: /-P-/.test(q.get("id")) ? "PATIENT CARD" : "STAFF CARD", sub: "" });

function qr(text) {
  const c = qrcode(0, "M"); c.addData(text); c.make();
  const wrap = document.createElement("div"); wrap.className = "qr"; wrap.innerHTML = c.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
  return wrap;
}
const logo = () => h("img", { src: "assets/logo.svg", alt: "" });
const nfcMark = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "nfc"); s.innerHTML = '<path d="M5 8a6 6 0 0 1 0 8M9 5.5a10 10 0 0 1 0 13M13 3a14 14 0 0 1 0 18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'; return s; };
const front = (c) => h("div", { class: "cardface" }, nfcMark(), h("div", { class: "lg" }, logo(), "TapCare"),
  h("div", h("div", { class: "sm" }, c.role), h("div", { class: "nm" }, c.name), h("div", { class: "sm" }, c.sub)), h("div", { class: "idno" }, c.id));
const back = (c) => h("div", { class: "cardface back" }, h("div", { style: "display:flex;gap:4mm;align-items:center" }, qr(urlFor(c.id)),
  h("div", { style: "font-size:2.7mm;line-height:1.35" }, h("b", "Tap this card on your phone"), h("div", "or scan the code to open TapCare. A PIN or password is always required."), h("div", { style: "margin-top:2mm;font-family:ui-monospace,monospace;font-weight:700" }, c.id))),
  h("div", { style: "font-size:2.4mm;color:#5A6B8C" }, "Found this card? Please return it to the hospital helpdesk. Sample card for a class demo."));

const root = document.getElementById("root");
root.append(h("div", { class: "noprint stack" }, h("h1", "Printable cards"), h("p", { class: "muted" }, "Card size is 85.6 x 54 mm (standard ID card). Use Print (Ctrl/Cmd + P) and turn on background graphics.")));
for (const c of cards) {
  root.append(h("section", { class: "card stack" },
    h("h2", { style: "margin:0" }, c.name), h("div", { class: "cardsheet" }, front(c), back(c)),
    h("div", { class: "noprint stack" },
      h("div", { class: "small muted" }, "Write this exact web address into the NFC card as a URL record:"),
      h("div", { class: "urlbox", id: "u-" + c.id }, urlFor(c.id)),
      h("div", { class: "row" }, h("button", { class: "btn sm", on: { click: async (e) => { try { await navigator.clipboard.writeText(urlFor(c.id)); e.target.textContent = "Copied!"; } catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("u-" + c.id)); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = "Selected - copy it"; } } } }, "Copy address"), h("a", { class: "btn sm ghost", href: urlFor(c.id) }, "Test it here")))));
}
root.append(h("div", { class: "card noprint stack" }, h("h2", "Write the cards with an iPhone (about 2 minutes each)"),
  h("ol", h("li", "Buy blank NFC cards: NTAG215 (or NTAG213/216) PVC cards."), h("li", "Install the free app NFC Tools (or NFC Tools PRO) from the App Store."),
    h("li", "In the app: Write > Add a record > URL/URI > paste the address above > OK."), h("li", "Tap Write and hold the top back edge of the iPhone against the blank card until it says Write complete."),
    h("li", "Test: lock the screen, wake it and hold the card near the top edge of an iPhone XS or newer. A TapCare notification appears. Tap it and Safari opens the verification screen."),
    h("li", "Optional: lock the card in the app (Other > Lock tag) so nobody can rewrite it. This cannot be undone.")),
  h("p", { class: "small muted" }, "The card only stores this web address with the ID number. No medical data is ever on the card, so a lost card cannot be read without the PIN or password.")));
</script>
</body>
</html>
